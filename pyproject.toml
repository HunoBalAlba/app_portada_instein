[project]
name = "app-portada-instein"
version = "0.1.0"
description = "Portada interactiva del Instituto Técnico Integrado San Antonio de Padua (INSTEIN)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tu Nombre", email = "tu@email.com" }]
license = { text = "MIT" }

dependencies = [
    "reflex>=0.9.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_portada_instein"]

# ======================================================================
# Pytest
# ======================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
# ⚠️ CORREGIDO: apunta a la ruta real (dentro del paquete).
testpaths = ["app_portada_instein/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app_portada_instein.dominio.kepler",
    "--cov-report=term-missing",
]
markers = [
    "slow: tests que tardan más de 100ms",
    "integration: tests que cruzan varios módulos",
]

# ======================================================================
# Coverage
# ======================================================================

[tool.coverage.run]
branch = true
source = ["app_portada_instein"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ======================================================================
# Ruff
# ======================================================================

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "N", "RUF"]
ignore = [
    # Los TypedDict con clases vacías son legítimos.
    "RUF012",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "reflex-hosting-cli>=0.1.72",
]
