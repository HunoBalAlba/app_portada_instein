# =====================================================================
# Configuración de Ruff para INSTEIN
# =====================================================================

line-length = 100
target-version = "py312"
indent-width = 4
src = ["app_portada_instein", "tests"]

exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache",
    ".nox", ".pytest_cache", ".ruff_cache", ".svn", ".tox",
    ".venv", "__pypackages__", "_build", "build", "dist",
    "node_modules", "site-packages", "venv", "web", ".web",
    "main.py",
]

[lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
    "RUF", "ARG", "PTH", "RET", "TCH", "PIE", "T20",
    "PT", "Q", "TID", "ERA", "PL",
]
ignore = [
    # Argumentos sin usar en callbacks de Reflex.
    "ARG001",
    # TypedDict con dict literal.
    "RUF012",
    # Imports locales válidos.
    "PLC0415",
    # Números mágicos en tests/config.
    "PLR2004",
    # Funciones con muchos argumentos (config de órbitas).
    "PLR0913",
    "PLR0917",
    # TODO comments.
    "TD002",
    "TD003",
    # Imports relativos válidos dentro del paquete.
    "TID252",
    # Comentarios de sección (=== ... ===) son legítimos.
    "ERA001",
    # En dash y otros caracteres Unicode en docstrings.
    "RUF001",
    "RUF002",
    "RUF003",
    # print() en código de desarrollo.
    "T201",
    # __all__ no ordenado (agrupado por categorías).
    "RUF022",
    # pytest.raises sin match (los tests ya validan el tipo).
    "PT011",
]

[lint.per-file-ignores]
"app_portada_instein/tests/**/*.py" = [
    "S101",
    "PLR2004",
    "ARG001",
    "ARG002",
    "T20",
    "ERA001",
    "N802",
    "N803",
    "N806",
    "F841",
    "PLC2401",  # TestOrbitaElíptica con acentos es válido.
]
"app_portada_instein/dominio/kepler/constantes.py" = ["PLR2004"]
"app_portada_instein/dominio/kepler/resolver.py" = ["N806", "N818"]
"app_portada_instein/dominio/kepler/keyframes.py" = ["N806"]
"app_portada_instein/dominio/kepler/posicion.py" = ["N806"]

[lint.isort]
known-first-party = ["app_portada_instein"]
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

[lint.flake8-pytest-style]
fixture-parentheses = false
parametrize-names-type = "csv"
parametrize-values-type = "list"

[lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"
multiline-quotes = "double"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
